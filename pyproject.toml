[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yay-auto-review"
version = "0.3.3"
description = "Review AUR package recipes with Codex before yay builds them"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
yay-auto-review = "yay_auto_review.cli:main"
yay-auto-review-makepkg = "yay_auto_review.cli:makepkg_main"

[tool.setuptools]
packages = ["yay_auto_review"]
include-package-data = false

[tool.setuptools.package-data]
yay_auto_review = ["locales/*.json"]

[tool.setuptools.data-files]
"share/yay-auto-review" = ["lua/yay-auto-review.lua", "config.example.toml"]
