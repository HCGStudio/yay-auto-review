# ~/.config/yay-auto-review/config.toml
# Codex CLI must already be logged in (codex login).
# UI and Codex report language: en (default), zh_CN or auto.
# Priority: --lang > YAY_AUTO_REVIEW_LANG > language.
# Explicit auto uses LC_ALL > LC_MESSAGES > LANG; otherwise ignore system locale.
# C/POSIX and unsupported locales use English. Language changes invalidate cache.
language = "en"
codex = "codex"
# Unset uses the Codex CLI default model. User config is not loaded.
# model = "your-model-id"
timeout_seconds = 300
# Default: $XDG_CACHE_HOME/yay-auto-review (or ~/.cache/yay-auto-review).
# cache_dir = "/absolute/path/to/cache"
# Real makepkg executable; never point this at yay-auto-review-makepkg.
makepkg = "/usr/bin/makepkg"
